[package]
name = "kosmos-oden-desktop"
version = "0.8.1"
description = "Internal-alpha native shell for Kosmos-Oden Standalone"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "kosmos_oden_desktop"
crate-type = ["rlib"]

[[bin]]
name = "kosmos-oden-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
rfd = "=0.17.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5" }

[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }
