[package]
name = "kosmos-oden-desktop"
version = "0.8.3"
description = "Internal-alpha native shell for Kosmos-Oden Standalone"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "kosmos_oden_desktop"
crate-type = ["rlib"]

[[bin]]
name = "kosmos-oden-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
rfd = "=0.17.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }
