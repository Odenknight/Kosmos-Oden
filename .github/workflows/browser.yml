name: Browser

# Real-browser rendering gate (CI/CD directive §7.4) — the assessment's largest
# assurance gap. Boots the built WebGL2 artifact in Chromium via Playwright and
# asserts the r187 renderer initializes, draws the scene, survives a context
# loss/restore cycle, and renders under the plugin's iframe sandbox.
#
# Chromium uses software WebGL2 on every tracked push or PR. The full matrix
# runs headed Firefox and WebKit with Mesa/Xvfb and compares visual baselines.
# See CONTRIBUTING.md for the release commands.

on:
  push:
    paths:
      - "src/**"
      - "scripts/**"
      - "test/browser/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/browser.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-chromium:
    name: browser-chromium (software WebGL2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/engine-access
        with:
          deploy-key: ${{ secrets.GKOS_ENGINE_DEPLOY_KEY }}
      - run: npm ci
      - name: Build artifacts (needed by the browser tests)
        run: npm run build
      - name: Install Chromium for the lockfile-pinned Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests (Chromium / SwiftShader)
        run: npm run test:browser:chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14
