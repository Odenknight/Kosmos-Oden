name: Browser (full matrix)

# Scheduled and on-demand release qualification. Chromium smoke tests also run on PRs.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  browser-full:
    name: Firefox, WebKit and Chromium visual regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/engine-access
        with:
          deploy-key: ${{ secrets.GKOS_ENGINE_DEPLOY_KEY }}
      - run: npm ci
      - run: npm run build
      - name: Install browsers and the Mesa X11 software renderer
        run: |
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get install -y mesa-utils libgl1-mesa-dri libegl-mesa0 xvfb xauth
      - name: Firefox and WebKit renderer tests on Xvfb
        id: ffwk
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX" sh -ec '
            glxinfo -B
            npm run test:browser:full -- --headed --workers=1 --output=test-results/full
          '
      - name: Chromium visual regression
        id: visual
        if: ${{ !cancelled() && (steps.ffwk.outcome == 'success' || steps.ffwk.outcome == 'failure') }}
        run: npm run test:visual -- --workers=1 --output=test-results/visual
      - name: Record suite outcomes
        if: always()
        run: |
          {
            echo '| Suite | Outcome |'
            echo '| --- | --- |'
            echo '| Firefox and WebKit | ${{ steps.ffwk.outcome }} |'
            echo '| Chromium visual | ${{ steps.visual.outcome }} |'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-full-report-${{ github.sha }}
          path: test-results/
          retention-days: 14
